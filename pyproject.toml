[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alginate-ms2"
version = "1.0.0rc7"
description = "Alginate HCD-MS/MS learned-NMF and fixed fragment-ratio Ridge models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
mzml = ["pyteomics>=4.6,<6", "lxml>=4.9,<7"]
dev = ["pytest>=7", "pandas>=2", "pyteomics>=4.6,<6", "lxml>=4.9,<7"]

[tool.setuptools.packages.find]
where = ["src"]
